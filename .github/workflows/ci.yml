name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Build for iOS
        run: >-
          xcodebuild build
          -scheme SafeMediaKit
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
      - name: Test
        run: swift test
